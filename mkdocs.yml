site_name: Younghwan Shin
site_description: ""
site_author: Younghwan Shin
# 배포 주소가 정해지면 수정하세요 (예: GitHub Pages)
site_url: https://dubli91.github.io/

theme:
  name: material
  language: ko
  logo: assets/images/img_qpro.png
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  features:
    # navigation.instant 는 i18n 언어 셀렉터의 페이지 유지 링크와 호환되지 않아 제거
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  icon:
    repo: fontawesome/brands/github

# 소스 저장소 (유저 사이트 배포 기준)
repo_url: https://github.com/dubli91/dubli91.github.io
repo_name: dubli91/dubli91.github.io

nav:
  - 소개: index.md
  - 기술 & 프로젝트:
      - 기술 스택: tech-stack.md
      - 프로젝트:
          - 전체 보기: projects/index.md
  - Blog:
      - blog/index.md
      - blog/posts/gke-zone-reservation.md
      - blog/posts/aws-lambda-adapter.md
      - blog/posts/ralph-loop.md
      - blog/posts/first-opensource-contribution.md
      - blog/posts/testcontainers-jpa-test.md
      - blog/posts/reading-translation-vs-original.md
      - blog/posts/java-optional.md
      - blog/posts/java-record.md
      - blog/posts/cka-exam-review.md
      - blog/posts/pydeps-python-dependency.md
      - blog/posts/heap-remove-middle-element.md
      - blog/posts/main-overriding-overloading.md
      - blog/posts/spring-exception-handling.md
  - IIDX: rhythm.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: ko
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ko
          name: 한국어
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: ""
          nav_translations:
            소개: About
            기술 & 프로젝트: Tech & Projects
            기술 스택: Tech Stack
            프로젝트: Projects
            전체 보기: All Projects
            IIDX: Rhythm Games
  - minify:
      minify_html: true

extra_css:
  - stylesheets/extra.css

extra:
  # 푸터의 "Made with Material for MkDocs" 문구 제거
  generator: false
  # 언어 셀렉터는 i18n 플러그인(reconfigure_material)이 자동 생성
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dubli91
      name: GitHub
    - icon: fontawesome/solid/paper-plane
      link: mailto:dublineryh@gmail.com
      name: Email

copyright: Copyright &copy; 2026 Younghwan Shin
